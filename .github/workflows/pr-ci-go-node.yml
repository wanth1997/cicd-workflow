name: Reusable PR CI - Go Node

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      go_version_file:
        required: true
        type: string
      go_dependency_file:
        required: true
        type: string
      node_version:
        required: true
        type: string
      frontend_dir:
        required: true
        type: string
      frontend_lockfile:
        required: true
        type: string
      backend_fast_suite:
        required: true
        type: string
      backend_migration_suite:
        required: true
        type: string
      run_backend_full_tests:
        required: false
        type: boolean
        default: false
      backend_full_shards_json:
        required: false
        type: string
        default: "[]"
      backend_ci_command:
        required: true
        type: string
      migration_check_command:
        required: true
        type: string
      frontend_ci_command:
        required: true
        type: string
      postgres_image:
        required: false
        type: string
        default: postgres:15
      postgres_db:
        required: false
        type: string
        default: app_ci
      postgres_user:
        required: false
        type: string
        default: app
      postgres_password:
        required: false
        type: string
        default: app
      artifact_retention_days:
        required: false
        type: number
        default: 14
      telegram_chat_id:
        required: false
        type: string
        default: ""
      telegram_notify_on:
        required: false
        type: string
        default: failure
      # Where the backend and frontend jobs run (notify-telegram always
      # runs on ubuntu-latest). Either one label, e.g. ubuntu-latest, or a
      # JSON array of labels, e.g. ["self-hosted","Linux","X64","wsl"]; a
      # value that starts with [ is read as JSON. A self-hosted label set
      # must include a label that no deploy or production runner carries.
      # The caller picks the value (and its fallback to GitHub-hosted).
      runner:
        required: false
        type: string
        default: ubuntu-latest
      # GOFLAGS for the Go jobs, e.g. -p=4 to bound parallel package builds
      # on a self-hosted machine shared with other jobs. Empty: Go defaults.
      go_flags:
        required: false
        type: string
        default: ""
      # Extra docker options for the PostgreSQL service container. Service
      # containers run outside the runner's own resource limits, so the
      # default caps them.
      postgres_service_options:
        required: false
        type: string
        default: --memory=768m --cpus=2
      # Absolute path of a lock file that every runner installation on one
      # self-hosted machine shares, e.g. /tmp/<service>-ci-backend.lock.
      # When set, and only on a self-hosted runner, the backend fast suite
      # and each backend full shard (unless its matrix entry has
      # "host_lock": false) run backend_ci_command under an exclusive flock
      # on it, so suites that use one host-wide resource (for example a
      # flock on /tmp) run one at a time across jobs and workflow runs. The
      # wait is bounded (20 min, added to the job's timeout) and fails the
      # job with an error when it runs out. Empty: no lock.
      backend_host_lock:
        required: false
        type: string
        default: ""
    secrets:
      telegram_bot_token:
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-fast-tests:
    name: backend-fast-tests
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner || 'ubuntu-latest' }}
    # 12, plus the 20-minute bound on the backend host lock wait when
    # backend_host_lock is set.
    timeout-minutes: ${{ inputs.backend_host_lock != '' && 32 || 12 }}
    env:
      GOFLAGS: ${{ inputs.go_flags }}
    steps:
      # A self-hosted runner's user, and so its $HOME, is shared by every job
      # and repository on that machine. This job keeps its Go and npm caches
      # and any global config in a HOME under RUNNER_TEMP, which the runner
      # empties for each job. GitHub-hosted runners skip it.
      - name: Use a per-job HOME on self-hosted runners
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: true
          cache-dependency-path: ${{ inputs.go_dependency_file }}

      - name: Download Go modules
        run: go mod download

      - name: Run backend fast tests
        env:
          BACKEND_TEST_SUITE: ${{ inputs.backend_fast_suite }}
          GO_TEST_JSON: .artifacts/ci/backend-fast-go-test.json
          BACKEND_HOST_LOCK: ${{ inputs.backend_host_lock }}
          BACKEND_HOST_LOCK_WAIT_SECONDS: "1200"
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          # The backend_host_lock input: on a self-hosted runner, hold an
          # exclusive flock on that file (fd 9, inherited by the command and
          # released when the last process holding it exits) before the
          # command starts. GitHub-hosted runners never lock.
          if [[ -n "${BACKEND_HOST_LOCK:-}" && "${RUNNER_KIND:-}" == self-hosted && "${SHARD_HOST_LOCK:-}" != false ]]; then
            if [[ "$BACKEND_HOST_LOCK" != /* ]]; then
              echo "::error title=Backend host lock::backend_host_lock must be an absolute path"
              exit 1
            fi
            if ! command -v flock >/dev/null 2>&1; then
              echo "::error title=Backend host lock::flock is not installed on this self-hosted runner (util-linux); install it, or run on GitHub-hosted runners"
              exit 1
            fi
            # Created world-readable, so every runner user on the machine can
            # open it; flock needs only a read descriptor.
            if [[ ! -e "$BACKEND_HOST_LOCK" ]]; then
              (umask 022 && : >>"$BACKEND_HOST_LOCK") 2>/dev/null || true
            fi
            if ! exec 9<"$BACKEND_HOST_LOCK"; then
              echo "::error title=Backend host lock::cannot open the lock file $BACKEND_HOST_LOCK"
              exit 1
            fi
            echo "Waiting up to ${BACKEND_HOST_LOCK_WAIT_SECONDS}s for the backend host lock $BACKEND_HOST_LOCK"
            lock_wait_started=$SECONDS
            if ! flock -w "$BACKEND_HOST_LOCK_WAIT_SECONDS" 9; then
              echo "::error title=Backend host lock::waited ${BACKEND_HOST_LOCK_WAIT_SECONDS}s for $BACKEND_HOST_LOCK, which another backend suite on this machine still holds; re-run later or run PR CI on GitHub-hosted runners"
              exit 1
            fi
            echo "Holding the backend host lock after $((SECONDS - lock_wait_started))s"
          fi
          ${{ inputs.backend_ci_command }}

      - name: Upload backend fast Go test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service_name }}-backend-fast-go-test-report
          path: .artifacts/ci/backend-fast-go-test.json
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact_retention_days }}

  backend-migration-tests:
    name: backend-migration-tests
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 12
    env:
      GOFLAGS: ${{ inputs.go_flags }}
    steps:
      # See backend-fast-tests.
      - name: Use a per-job HOME on self-hosted runners
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: true
          cache-dependency-path: ${{ inputs.go_dependency_file }}

      - name: Download Go modules
        run: go mod download

      - name: Run backend migration regression tests
        env:
          BACKEND_TEST_SUITE: ${{ inputs.backend_migration_suite }}
          GO_TEST_JSON: .artifacts/ci/backend-migration-go-test.json
        run: ${{ inputs.backend_ci_command }}

      - name: Upload backend migration Go test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service_name }}-backend-migration-go-test-report
          path: .artifacts/ci/backend-migration-go-test.json
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact_retention_days }}

  backend-full-tests:
    name: backend-full-tests (${{ matrix.shard }})
    if: ${{ inputs.run_backend_full_tests }}
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner || 'ubuntu-latest' }}
    # 20, plus the 20-minute bound on the backend host lock wait.
    timeout-minutes: ${{ inputs.backend_host_lock != '' && 40 || 20 }}
    env:
      GOFLAGS: ${{ inputs.go_flags }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.backend_full_shards_json) }}
    steps:
      # See backend-fast-tests.
      - name: Use a per-job HOME on self-hosted runners
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: true
          cache-dependency-path: ${{ inputs.go_dependency_file }}

      - name: Download Go modules
        run: go mod download

      - name: Run backend full tests
        env:
          BACKEND_TEST_SUITE: ${{ matrix.suite }}
          GO_TEST_JSON: .artifacts/ci/${{ matrix.report }}
          BACKEND_HOST_LOCK: ${{ inputs.backend_host_lock }}
          BACKEND_HOST_LOCK_WAIT_SECONDS: "1200"
          RUNNER_KIND: ${{ runner.environment }}
          SHARD_HOST_LOCK: ${{ matrix.host_lock }}
        run: |
          # Same as "Run backend fast tests", plus the shard's host_lock.
          if [[ -n "${BACKEND_HOST_LOCK:-}" && "${RUNNER_KIND:-}" == self-hosted && "${SHARD_HOST_LOCK:-}" != false ]]; then
            if [[ "$BACKEND_HOST_LOCK" != /* ]]; then
              echo "::error title=Backend host lock::backend_host_lock must be an absolute path"
              exit 1
            fi
            if ! command -v flock >/dev/null 2>&1; then
              echo "::error title=Backend host lock::flock is not installed on this self-hosted runner (util-linux); install it, or run on GitHub-hosted runners"
              exit 1
            fi
            # Created world-readable, so every runner user on the machine can
            # open it; flock needs only a read descriptor.
            if [[ ! -e "$BACKEND_HOST_LOCK" ]]; then
              (umask 022 && : >>"$BACKEND_HOST_LOCK") 2>/dev/null || true
            fi
            if ! exec 9<"$BACKEND_HOST_LOCK"; then
              echo "::error title=Backend host lock::cannot open the lock file $BACKEND_HOST_LOCK"
              exit 1
            fi
            echo "Waiting up to ${BACKEND_HOST_LOCK_WAIT_SECONDS}s for the backend host lock $BACKEND_HOST_LOCK"
            lock_wait_started=$SECONDS
            if ! flock -w "$BACKEND_HOST_LOCK_WAIT_SECONDS" 9; then
              echo "::error title=Backend host lock::waited ${BACKEND_HOST_LOCK_WAIT_SECONDS}s for $BACKEND_HOST_LOCK, which another backend suite on this machine still holds; re-run later or run PR CI on GitHub-hosted runners"
              exit 1
            fi
            echo "Holding the backend host lock after $((SECONDS - lock_wait_started))s"
          fi
          ${{ inputs.backend_ci_command }}

      - name: Summarize backend shard
        if: always()
        env:
          BACKEND_TEST_SHARD: ${{ matrix.shard }}
          BACKEND_TEST_SUITE: ${{ matrix.suite }}
          GO_TEST_JSON: .artifacts/ci/${{ matrix.report }}
        run: |
          if [[ ! -f "$GO_TEST_JSON" ]]; then
            echo "### Backend shard: $BACKEND_TEST_SHARD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No Go test JSON report was generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["GO_TEST_JSON"])
          tests = {}
          packages = set()
          for line in path.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              package = event.get("Package", "")
              if package:
                  packages.add(package)
              test = event.get("Test")
              action = event.get("Action")
              if test and action in {"pass", "fail", "skip"}:
                  tests[(package, test)] = (action, float(event.get("Elapsed", 0) or 0))

          passed = sum(1 for action, _ in tests.values() if action == "pass")
          failed = sum(1 for action, _ in tests.values() if action == "fail")
          skipped = sum(1 for action, _ in tests.values() if action == "skip")
          slowest = sorted(
              ((elapsed, package, test, action) for (package, test), (action, elapsed) in tests.items()),
              reverse=True,
          )[:10]

          print(f"### Backend shard: {os.environ['BACKEND_TEST_SHARD']}")
          print("")
          print(f"- Suite: `{os.environ['BACKEND_TEST_SUITE']}`")
          print(f"- Packages: `{len(packages)}`")
          print(f"- Tests passed: `{passed}`")
          print(f"- Tests failed: `{failed}`")
          print(f"- Tests skipped: `{skipped}`")
          print("")
          print("| Time | Result | Test |")
          print("| ---: | --- | --- |")
          for seconds, package, test, action in slowest:
              print(f"| {seconds:.2f}s | `{action}` | `{package}.{test}` |")
          PY

      - name: Upload backend full Go test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service_name }}-backend-full-${{ matrix.shard }}-go-test-report
          path: .artifacts/ci/${{ matrix.report }}
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact_retention_days }}

  backend-migration:
    name: backend-migration
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    services:
      postgres:
        image: ${{ inputs.postgres_image }}
        env:
          POSTGRES_DB: ${{ inputs.postgres_db }}
          POSTGRES_USER: ${{ inputs.postgres_user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres_password }}
        # Docker picks the host port, so jobs that share one self-hosted
        # machine never collide on 5432 (see "Point at the PostgreSQL
        # service").
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U ${{ inputs.postgres_user }} -d ${{ inputs.postgres_db }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          ${{ inputs.postgres_service_options }}
    env:
      GOFLAGS: ${{ inputs.go_flags }}
    steps:
      # See backend-fast-tests.
      - name: Use a per-job HOME on self-hosted runners
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: true
          cache-dependency-path: ${{ inputs.go_dependency_file }}

      - name: Download Go modules
        run: go mod download

      # DATABASE_URL and TEST_DATABASE_URL point at the host port Docker
      # mapped to the service's 5432; later steps read them from GITHUB_ENV.
      - name: Point at the PostgreSQL service
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          PG_DB: ${{ inputs.postgres_db }}
          PG_USER: ${{ inputs.postgres_user }}
          PG_PASSWORD: ${{ inputs.postgres_password }}
        run: |
          set -euo pipefail
          if [[ ! "$PG_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error title=PostgreSQL service::no host port is mapped to the service's 5432"
            exit 1
          fi
          creds="${PG_USER}:${PG_PASSWORD}"
          url="postgres://${creds}@localhost:${PG_PORT}/${PG_DB}?sslmode=disable"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "PostgreSQL service on host port ${PG_PORT}"

      - name: Run migration and schema check
        run: ${{ inputs.migration_check_command }}

  frontend-checks:
    name: frontend-checks
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # See backend-fast-tests.
      - name: Use a per-job HOME on self-hosted runners
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.frontend_lockfile }}

      - name: Run frontend checks
        run: ${{ inputs.frontend_ci_command }}

  notify-telegram:
    name: notify-telegram
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skipped (not billed) when notifications are off, e.g. the caller
    # already alerts on failures from a workflow_run listener.
    if: ${{ always() && inputs.telegram_notify_on != 'never' }}
    needs:
      - backend-fast-tests
      - backend-migration-tests
      - backend-full-tests
      - backend-migration
      - frontend-checks
    steps:
      - name: Send Telegram notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegram_bot_token }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          TELEGRAM_NOTIFY_ON: ${{ inputs.telegram_notify_on }}
          SERVICE_NAME: ${{ inputs.service_name }}
          WORKFLOW_STAGE: PR CI
          RUN_BACKEND_FULL_TESTS: ${{ inputs.run_backend_full_tests }}
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          def one_line(value, limit=140):
              text = " ".join((value or "").strip().split())
              if len(text) > limit:
                  return text[: limit - 3] + "..."
              return text

          def event_payload():
              path = os.environ.get("GITHUB_EVENT_PATH", "")
              if not path:
                  return {}
              try:
                  with open(path, encoding="utf-8") as handle:
                      return json.load(handle)
              except (OSError, json.JSONDecodeError):
                  return {}

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              print("Telegram notification disabled: telegram_chat_id or telegram_bot_token is empty.")
              raise SystemExit(0)

          needs = json.loads(os.environ.get("NEEDS_JSON", "{}") or "{}")
          job_results = {
              job_name: job_data.get("result", "unknown")
              for job_name, job_data in needs.items()
          }
          if os.environ.get("RUN_BACKEND_FULL_TESTS", "false").lower() != "true":
              job_results.pop("backend-full-tests", None)
          results = list(job_results.values())
          if any(result == "failure" for result in results):
              status = "failed"
          elif any(result == "cancelled" for result in results):
              status = "cancelled"
          elif results and all(result == "success" for result in results):
              status = "success"
          elif any(result == "skipped" for result in results):
              status = "skipped"
          else:
              status = "unknown"

          notify_on = os.environ.get("TELEGRAM_NOTIFY_ON", "failure").strip().lower()
          if notify_on not in {"always", "failure", "never"}:
              print(f"Unsupported telegram_notify_on={notify_on!r}; using failure.")
              notify_on = "failure"
          should_send = notify_on == "always" or (notify_on == "failure" and status != "success")
          if notify_on == "never" or not should_send:
              print(f"Telegram notification skipped for status={status}.")
              raise SystemExit(0)

          event = event_payload()
          pull_request = event.get("pull_request") or {}
          head_commit = event.get("head_commit") or {}
          workflow_run = event.get("workflow_run") or {}
          workflow_head_commit = workflow_run.get("head_commit") or {}

          repo = os.environ["GITHUB_REPOSITORY"]
          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com").rstrip("/")
          run_id = os.environ["GITHUB_RUN_ID"]
          run_url = f"{server_url}/{repo}/actions/runs/{run_id}"
          branch = (
              (pull_request.get("head") or {}).get("ref")
              or os.environ.get("GITHUB_HEAD_REF")
              or os.environ.get("GITHUB_REF_NAME")
              or "unknown"
          )
          target_branch = (
              (pull_request.get("base") or {}).get("ref")
              or os.environ.get("GITHUB_BASE_REF")
              or ""
          )
          branch_line = f"{branch} -> {target_branch}" if target_branch else branch
          commit_sha = (
              (pull_request.get("head") or {}).get("sha")
              or workflow_run.get("head_sha")
              or os.environ.get("GITHUB_SHA", "")
          )
          short_sha = commit_sha[:7] if commit_sha else "unknown"
          commit_title = one_line(
              pull_request.get("title")
              or head_commit.get("message")
              or workflow_head_commit.get("message")
          )
          action = {
              "success": "No action needed.",
              "failed": "Check the failed job in the GitHub Run.",
              "cancelled": "Check whether the cancellation was expected.",
              "skipped": "Check workflow conditions and dependencies.",
          }.get(status, "Check the GitHub Run.")

          lines = [
              f"[{status.upper()}] {os.environ['SERVICE_NAME']} / {os.environ['WORKFLOW_STAGE']}",
              "",
              f"Repo: {repo}",
              f"Stage: {os.environ['WORKFLOW_STAGE']}",
              f"Workflow: {os.environ.get('GITHUB_WORKFLOW', 'unknown')}",
              f"Status: {status}",
              f"Branch: {branch_line}",
          ]
          if pull_request.get("number"):
              pr_title = one_line(pull_request.get("title"))
              lines.append(f"PR: #{pull_request['number']} - {pr_title}")
          if commit_title:
              lines.append(f"Commit: {commit_title} ({short_sha})")
          else:
              lines.append("Commit: not available in event payload")
          lines.extend(
              [
                  f"Actor: {os.environ.get('GITHUB_ACTOR', 'unknown')}",
                  f"Event: {os.environ.get('GITHUB_EVENT_NAME', 'unknown')}",
                  f"Run: #{os.environ.get('GITHUB_RUN_NUMBER', 'unknown')} attempt {os.environ.get('GITHUB_RUN_ATTEMPT', '1')}",
                  "",
                  "Jobs:",
              ]
          )
          for job_name, result in job_results.items():
              lines.append(f"- {job_name}: {result}")
          lines.extend(["", f"Action: {action}", "", "GitHub Run:", run_url])

          payload = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": "\n".join(lines),
                  "disable_web_page_preview": "true",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              response.read()
          print("Telegram notification sent.")
          PY
